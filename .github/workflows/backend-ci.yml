name: backend

on:
  push:
    paths: ["backend/**", "relay/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", "relay/**", ".github/workflows/backend-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: resilience
          POSTGRES_PASSWORD: resilience
          POSTGRES_DB: resilience_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U resilience" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://resilience:resilience@localhost:5432/resilience_test
      TEST_DATABASE_URL: postgresql+psycopg://resilience:resilience@localhost:5432/resilience_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: pytest
