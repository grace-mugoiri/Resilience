# Second independent local Resilience relay. Production must use a separate host/operator.
[info]
relay_url = "ws://localhost:7778/"
name = "resilience-relay-2"
description = "Private relay for Resilience. Gift wraps are served only to their recipient."

[network]
address = "0.0.0.0"
port = 8080

[options]
reject_future_seconds = 1800

[limits]
messages_per_sec = 5
subscriptions_per_min = 10
limit_scrapers = true
max_event_bytes = 131072
max_ws_message_bytes = 135168
max_ws_frame_bytes = 135168
event_kind_allowlist = [0, 1059, 30000, 30078, 30382, 30383]

[authorization]
nip42_auth = true
nip42_dms = true

[verified_users]
mode = "disabled"
