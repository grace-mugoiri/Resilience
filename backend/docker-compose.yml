# Local stack: database, relay, API and worker.
#   cp .env.example .env && python scripts/sign_config.py --dev   (paste PLATFORM_PUBKEY into .env)
#   docker compose up --build
services:
  db:
    image: postgres:16.15
    environment:
      POSTGRES_USER: resilience
      POSTGRES_PASSWORD: resilience
      POSTGRES_DB: resilience
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resilience"]
      interval: 5s
      retries: 10

  relay-1:
    image: scsibug/nostr-rs-relay:0.10.0
    environment:
      RUST_LOG: warn
    ports: ["7777:8080"]
    volumes:
      - ../relay/config.toml:/usr/src/app/config.toml:ro
      - relaydata1:/usr/src/app/db
    depends_on:
      relay-policy: {condition: service_healthy}

  relay-2:
    image: scsibug/nostr-rs-relay:0.10.0
    environment:
      RUST_LOG: warn
    ports: ["7778:8080"]
    volumes:
      - ../relay/config-2.toml:/usr/src/app/config.toml:ro
      - relaydata2:/usr/src/app/db
    depends_on:
      relay-policy: {condition: service_healthy}

  relay-policy:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://resilience:resilience@db:5432/resilience
    command: ["python", "-m", "app.relay.server"]
    expose: ["50051"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; connection = socket.create_connection(('127.0.0.1', 50051), timeout=2); connection.close()"
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
    # The API is the single migration owner. Waiting for it avoids concurrent Alembic runs.
    depends_on:
      api: {condition: service_healthy}

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://resilience:resilience@db:5432/resilience
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://resilience:resilience@db:5432/resilience
    command: ["python", "-m", "app.worker"]
    depends_on:
      api: {condition: service_started}

  # Local-only NIP-05 fixture used by scripts/local_approve_org.py. The generated file and
  # development admin secret are gitignored. Production deployments must serve NIP-05 from the
  # organization's real HTTPS domain and should not run this service.
  nip05-dev:
    build: .
    command: ["python", "-m", "http.server", "9000", "--directory", "/nip05"]
    volumes:
      - ./.dev-nip05:/nip05:ro
    expose: ["9000"]

volumes:
  pgdata:
  relaydata1:
  relaydata2:
