# nostr-rs-relay 0.10.0 config for Resilience. Only settings that differ from the defaults.
# Full reference: https://github.com/scsibug/nostr-rs-relay/blob/0.10.0/config.toml

[info]
# Must be the public wss:// URL in production: NIP-42 auth checks it.
relay_url = "ws://localhost:7777/"
name = "resilience-relay"
description = "Private relay for Resilience. Gift-wrapped messages are served only to their recipient."

[network]
address = "0.0.0.0"
port = 8080
# remote_ip_header is deliberately unset: we do not want client IPs in logs.

[options]
reject_future_seconds = 1800

[limits]
messages_per_sec = 5
subscriptions_per_min = 10
limit_scrapers = true

[authorization]
# NIP-42: clients authenticate with their key.
nip42_auth = true
# Gift wraps (kind 1059) and DMs are sent only to the authenticated recipient.
nip42_dms = true

[verified_users]
mode = "disabled"
